<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Автоэлектрик | Контакты</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #12161f;
            background-image: linear-gradient(rgba(18, 22, 31, 0.85), rgba(18, 22, 31, 0.85)), url('bg.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover;
            color: #e0e6ed;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1a2232;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #007bff;
        }
        header h1 { margin: 0; color: #fff; font-size: 2rem; }
        nav {
            background-color: #161b26;
            text-align: center;
            padding: 10px;
        }
        nav a {
            color: #a0aec0;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
            font-size: 1.1rem;
            display: inline-block;
        }
        nav a:hover, nav a.active { color: #007bff; }
        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .contact-box {
            background-color: #1a2232;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #2d3748;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .btn {
            display: inline-block;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 20px;
            font-size: 1.1rem;
        }
        .btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <header>
        <h1>Наши контакты</h1>
    </header>
    <nav>
        <a href="./index.html">Главная</a>
        <a href="./prices.html">Цены</a>
        <a href="./contacts.html" class="active">Контакты</a>
    </nav>
    <div class="container">
        <div class="contact-box">
            <h2>Как нас найти и записаться</h2>
            <p style="font-size: 1.1rem; margin: 15px 0;"><strong>📍 Адрес:</strong> Ваш город, ваша улица, бокс</p>
            <p style="font-size: 1.1rem; margin: 15px 0;"><strong>⏰ График работы:</strong> Ежедневно с 09:00 до 21:00 (по записи)</p>
            <p style="font-size: 1.1rem; margin: 15px 0;"><strong>📞 Телефон:</strong> +7 (999) 123-45-67</p>
            <p style="color: #a0aec0;">Перед приездом обязательно наберите по телефону или напишите!</p>
            <a href="tel:+79991234567" class="btn">📞 Позвонить сейчас</a>
        </div>
    </div>
</body>
</html>
